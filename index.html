<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Daanav</title>
<meta name="description" content="Daanav – track your gym workouts, sets and strength progress.">
<meta name="theme-color" content="#B3121F">
<script>try{var t=localStorage.getItem("daanav-theme");document.documentElement.dataset.theme=(t==="iron"||t==="chalk")?t:"red"}catch(e){document.documentElement.dataset.theme="red"}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daanav">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&family=Anton&family=Inter:wght@400;500;600;700;800&family=Archivo:wdth,wght@62..125,400..900&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="in">
    <div class="brand"><b>Daanav</b><span class="who"><span id="sync" class="sync" hidden></span><span id="hello"></span><button id="menuBtn" class="menubtn" type="button" aria-label="Open menu" hidden><span class="av" aria-hidden="true">D</span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></span></div>
    <button id="backBtn" class="backbtn" type="button" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Back</button>
    <p class="kicker" id="kicker"></p>
    <h1 id="title">Daanav</h1>
  </div>
</header>
<main id="app"><section class="card empty"><p>Loading…</p></section></main>
<nav aria-label="Sections">
  <button data-tab="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Workout</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Progress</button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>History</button>
</nav>
<div class="drawer" id="drawer" hidden><aside class="dr-panel" role="dialog" aria-modal="true" aria-label="Menu"></aside></div>
<div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="Exercise how-to" hidden></div>
<div class="cele" id="cele" role="dialog" aria-modal="true" hidden></div>
<div class="share" id="share" role="dialog" aria-modal="true" aria-label="Share your workout" hidden></div>
<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button id="toastUndo" type="button">Undo</button></div>
<noscript><p style="padding:20px">Daanav needs JavaScript turned on.</p></noscript>
<script src="config.js"></script>
<script src="figures.js"></script>
<script src="exdata.js"></script>
<script src="app.js"></script>
</body>
</html>
